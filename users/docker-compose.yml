services:
  mysql:
    image: 'mysql:8.0'
    container_name: users-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: 'mydatabase'
      MYSQL_USER: 'myuser'
      MYSQL_PASSWORD: 'secret'
      MYSQL_ROOT_PASSWORD: 'verysecret'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pverysecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: users-api
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      SERVER_PORT: '8081'
      SPRING_DATASOURCE_URL: 'jdbc:mysql://mysql:3306/mydatabase?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC'
      SPRING_DATASOURCE_USERNAME: 'myuser'
      SPRING_DATASOURCE_PASSWORD: 'secret'
      SPRING_JPA_HIBERNATE_DDL_AUTO: 'update'
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
