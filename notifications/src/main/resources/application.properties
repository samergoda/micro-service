spring.application.name=demo

# ----------------------------------------------------------------------
# Datasource (MySQL)
# Values can be overridden via environment variables (used by docker-compose).
# ----------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/notifications?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ----------------------------------------------------------------------
# Server
# ----------------------------------------------------------------------
server.port=${SERVER_PORT:8083}

# ----------------------------------------------------------------------
# Kafka consumer
# ----------------------------------------------------------------------
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:notifications}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Topic the consumer listens to (order service publishes here)
app.kafka.order-topic=${APP_KAFKA_ORDER_TOPIC:order-created}
