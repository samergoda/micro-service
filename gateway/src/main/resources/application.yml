server:
  port: 8082

spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      # Spring Cloud Gateway 5.x / Spring Boot 4.x Configuration Prefix
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

          routes:
            # Users Microservice (Port 8081)
            - id: users-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users, /api/users/**

            # Orders Microservice (Port 8080)
            - id: orders-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/orders, /api/orders/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders: "*"

      # Backward-compatible prefix mapping
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"

      routes:
        - id: users-service-compat
          uri: http://localhost:8081
          predicates:
            - Path=/api/users, /api/users/**

        - id: orders-service-compat
          uri: http://localhost:8080
          predicates:
            - Path=/api/orders, /api/orders/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
