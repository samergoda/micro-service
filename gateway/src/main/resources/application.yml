server:
  port: ${SERVER_PORT:8080}

# ----------------------------------------------------------------------
# Downstream service URIs. Defaults target localhost for local runs;
# docker-compose overrides the host via env vars (Docker service names).
# ----------------------------------------------------------------------
services:
  users:
    uri: ${USERS_SERVICE_URI:http://localhost:8081}
  orders:
    uri: ${ORDERS_SERVICE_URI:http://localhost:8082}
  notifications:
    uri: ${NOTIFICATIONS_SERVICE_URI:http://localhost:8083}

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      # Spring Cloud Gateway 5.x / Spring Boot 4.x Configuration Prefix
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

          routes:
            # Users Microservice
            - id: users-service
              uri: ${services.users.uri}
              predicates:
                - Path=/api/users, /api/users/**

            # Orders Microservice
            - id: orders-service
              uri: ${services.orders.uri}
              predicates:
                - Path=/api/orders, /api/orders/**

            # Notifications Microservice
            - id: notifications-service
              uri: ${services.notifications.uri}
              predicates:
                - Path=/api/notifications, /api/notifications/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders: "*"

      # Backward-compatible prefix mapping
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"

      routes:
        - id: users-service-compat
          uri: ${services.users.uri}
          predicates:
            - Path=/api/users, /api/users/**

        - id: orders-service-compat
          uri: ${services.orders.uri}
          predicates:
            - Path=/api/orders, /api/orders/**

        - id: notifications-service-compat
          uri: ${services.notifications.uri}
          predicates:
            - Path=/api/notifications, /api/notifications/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
